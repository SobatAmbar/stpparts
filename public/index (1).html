<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STP Parts</title>
<link rel="icon" href="img/logo.jpg">
<style>

:root{--bg:#eef1f5;--card:#fff;--ink:#1c2733;--mute:#66758a;--line:#d9dfe7;--pri:#1f5fbf;--gr:#1d7a4b;--grb:#dff3e7;--am:#9a5b00;--amb:#fdf0d2;--rd:#b42318;--rdb:#fde8e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header.top{display:flex;align-items:center;gap:16px;margin:12px 24px 4px;padding:10px 18px;background:#fff;border:1px solid var(--line);border-radius:6px}
.top .logo{height:46px;width:auto}
.top .co{font-weight:700;letter-spacing:.04em;color:var(--pri);font-size:13px}
h1{margin:0;font-size:22px;line-height:1.2}
.kop,.rtitle{display:none}
.credit{text-align:center;color:var(--mute);font-size:10.5px;line-height:1.45;padding:14px 12px 26px;border-top:1px solid var(--line);margin:8px 24px 0}
main{padding:10px 24px 28px}
.top{flex-wrap:wrap}.top .brand{min-width:230px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 0 auto}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:6px;padding:5px 14px 5px 12px;min-width:132px;cursor:pointer}
.stat b{display:block;font-size:21px;line-height:1.15}.stat span{color:var(--mute);font-size:12px;white-space:nowrap}
.stat:hover{background:#f4f8ff}.stat.on{background:#eaf2ff;box-shadow:0 0 0 1px var(--pri)}
.stat.w{border-left-color:var(--am)}.stat.c{border-left-color:var(--rd)}.stat.g{border-left-color:var(--gr)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin-bottom:8px}
.bar-l{display:flex;gap:8px;flex:1 1 360px;min-width:260px}.bar-l input[type=search]{flex:1;min-width:150px}
.bar-r{display:flex;flex-wrap:wrap;gap:8px 0}
.grp{display:flex;gap:6px;padding:0 14px;border-left:1px solid var(--line)}.grp:first-child{padding-left:0;border-left:0}.grp:last-child{padding-right:0}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);width:100%}
.bar input,.bar select{width:auto}
button{padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
button:hover{background:#f3f6fa}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.p:hover{background:#184c99}
button.d{color:var(--rd)}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:auto;--rw:200px}
table{width:100%;border-collapse:collapse}.wrap table{min-width:1400px}.rows{min-width:1400px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:#f6f8fb;font-weight:600;white-space:nowrap}
.wrap th{position:sticky;top:0;z-index:3;box-shadow:inset 0 -1px 0 var(--line)}
.wrap td{overflow-wrap:anywhere}.wrap td:nth-child(3),.wrap td:nth-child(5){overflow-wrap:normal}.wrap tbody tr:hover{background:#f6f9fe}
.wrap th:nth-child(1){width:70px}.wrap th:nth-child(2){min-width:175px}.wrap th:nth-child(3){min-width:200px}.wrap th:nth-child(5){min-width:195px}
.wrap th:nth-child(6){min-width:145px}.wrap th:nth-child(7){min-width:128px}.wrap th:nth-child(8){min-width:200px}.wrap th:nth-child(9){width:146px}
/* kolom Aksi menempel di kanan agar tombol selalu terlihat saat tabel digeser */
.wrap th:last-child,.wrap td:last-child{position:sticky;right:0;background:#fff;box-shadow:-6px 0 8px -6px rgba(20,30,45,.18)}
.wrap th:last-child{background:#f6f8fb;z-index:4}.wrap tr.crit td:last-child{background:#fff7f6}.wrap tbody tr:hover td:last-child{background:#f6f9fe}
@media screen and (max-width:1500px){.wrap table{font-size:13px;min-width:1300px}.wrap th,.wrap td{padding:7px 8px}}
tr.crit{background:#fff7f6}
td small{display:block;color:var(--mute)}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:600;font-size:12px;white-space:nowrap}
.fu-ok{background:var(--grb);color:var(--gr)}.fu-warn{background:var(--amb);color:var(--am)}.fu-bad{background:var(--rdb);color:var(--rd)}.fu-no{background:#e8ecf2;color:var(--mute)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:132px}.acts button{padding:4px 6px;font-size:13px;white-space:nowrap;text-align:center}
td select{padding:3px 5px;width:auto}
.whs{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;max-width:170px}.wh{font-size:11px;padding:1px 6px;border-radius:4px;background:#eef1f5;color:var(--mute);white-space:nowrap}.wh.on{background:var(--grb);color:var(--gr)}
.hint{background:#f5f9ff;border:1px solid #cfe0f7;border-radius:6px;padding:8px 10px}.hint:empty{display:none}.hint small{display:block;color:var(--mute)}.hint .whs{max-width:none}
.pl{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pl label.ck{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:400;cursor:pointer}
.pl label.ck:hover{background:#f6f8fb}.ck input{width:auto;margin:3px 0 0}.ck small{color:var(--mute)}
.pl-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.pl-head label{display:flex;gap:6px;align-items:center}.pl-head input{width:auto;margin:0}
#printArea{display:none}.pf{font-size:11px;margin:0 0 8px;color:#222}
.rr{display:flex;gap:6px;margin-top:6px}.rr select{flex:1;width:auto}.rr input{width:90px}.rr button{padding:4px 10px}
.rr-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.rq{white-space:nowrap}.rq .bd{margin-left:4px}
.rcell{min-width:calc(var(--rw) + 42px)}.rcell .rr{margin:0 0 4px;align-items:center}
.rcell .rr select{width:var(--rw);flex:none;padding:3px 5px;font-size:13px}.rcell .rr button{padding:2px 7px}
.addq{padding:2px 8px;font-size:12px;color:var(--pri)}
.fu-part{background:#e3edfc;color:#1f5fbf}.stat.d{border-left-color:#0e7490}
[hidden]{display:none!important}
.nx{margin-top:3px}.nx .bd{margin-left:4px}
.qd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--mute)}.qd button{padding:2px 8px;font-size:12px}
thead [data-sort]{cursor:pointer;user-select:none}thead [data-sort]:hover{color:var(--pri)}
thead [data-sort].asc::after{content:' ▲';font-size:10px}thead [data-sort].desc::after{content:' ▼';font-size:10px}
thead .sub{font-weight:400;color:var(--mute)}
.ck2{display:flex;align-items:center;gap:8px;font-weight:600}.ck2 input{width:auto;margin:0}
.ug{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;font-weight:400;color:var(--mute);cursor:pointer;white-space:nowrap}
.ug input{width:auto;margin:0}.ug.on{color:var(--rd);font-weight:700}
.wrap tr.urg td:first-child{box-shadow:inset 3px 0 0 var(--rd)}
.rows input[type=checkbox]{width:auto}
.empty{padding:34px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:8px;padding:0;width:min(760px,94vw);max-height:92vh;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(1040px,96vw)}
.rows-wrap{overflow-x:auto}.rows th{white-space:nowrap}.rows th small{font-weight:400;color:var(--mute)}
.rows [data-k=desc]{min-width:230px}.rows [data-k=part]{min-width:125px}.rows [data-k=msr],.rows [data-k=vendor],.rows [data-k=po]{min-width:115px}
dialog::backdrop{background:rgba(20,30,45,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dh h2{margin:0;font-size:17px}
.db{padding:16px 18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:600;font-size:13px}
label>*{margin-top:3px;font-weight:400}
.full{grid-column:1/-1}
.ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.drop{border:2px dashed var(--pri);border-radius:6px;padding:20px;text-align:center;color:var(--mute);background:#f5f9ff;margin:12px 0 6px;cursor:pointer}
.drop:focus{background:#e6f0ff}
.rows td{padding:4px}.rows input{padding:5px 7px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0;border-bottom:1px solid var(--line)}
.hist .la{display:flex;gap:6px;margin-top:6px}.hist .la button{padding:2px 8px}
.hist details{margin-top:6px}.hist summary{cursor:pointer;color:var(--am);font-size:12px}
.edl{margin:6px 0 0;padding:6px 10px;background:#fffaf0;border-left:3px solid #e0b252;font-size:12px;line-height:1.5}.edl s{color:var(--mute)}
.msg{color:var(--mute);min-height:20px}
@media(max-width:600px){.g2{grid-template-columns:1fr}header.top{margin:8px 12px 0}main{padding-left:12px;padding-right:12px}.top .logo{height:34px}}
@media print{@page{size:A4 landscape;margin:12mm}
body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header.top{display:none}
.credit{position:fixed;left:0;right:0;bottom:0;margin:0;padding:3px 0 0;background:#fff;border-top:1px solid #999;font-size:8.5px;line-height:1.35;color:#666}
.wrap,.stats,#dbinfo{display:none}
#printArea{display:block}
.pt{min-width:0;font-size:10.5px}.pt th,.pt td{padding:4px 6px}.pt tr{break-inside:avoid}.pt thead{display:table-header-group}.pt tfoot{display:table-footer-group}.pt tfoot td{border:0;height:13mm;padding:0}
.kop{display:flex;align-items:center;gap:16px;padding-bottom:6px;margin-bottom:8px;border-bottom:4px double #000;color:#000}
.kop .k-logo{height:46px;width:auto}.kop .k-mid{flex:1}
.k-name{font-size:21px;font-weight:600;line-height:1.2}.k-addr{font-size:10.5px;line-height:1.35}
.k-cert{display:flex;align-items:center;gap:8px}.k-cert img{height:46px;width:auto}
.rtitle{display:block;margin:4px 0 10px;font-size:16px}.rtitle small{font-weight:400;color:#444;margin-left:10px}
.stats{margin-bottom:10px;gap:8px}.stat{padding:4px 12px}.stat b{font-size:18px}main{padding:0}
.wrap td select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0}
.bar,.acts,.noprint{display:none}.wrap{border:0;overflow:visible}table{min-width:0;font-size:11px}.stat{break-inside:avoid}}

/* ===== Tambahan STP Parts (login, navigasi, tab Stok/Unggah/Pengguna/Cadangan) ===== */
header.top .user,.navbar .user{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.navbar .user .nm{font-weight:600}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-rw{background:var(--grb);color:var(--gr)}.b-ro{background:var(--amb);color:var(--am)}.b-ad{background:#dfe8ff;color:#1f3f99}
.meta{color:var(--mute);font-size:12px}
.navbar{background:#fff;border:1px solid var(--line);border-radius:6px;margin:8px 24px 0;padding:0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
nav#nav{display:flex;gap:2px;flex-wrap:wrap}
nav#nav a{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
nav#nav a.on{color:var(--pri);border-color:var(--pri)}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px}
.login img{height:46px;display:block;margin:0 auto 10px}.login h2{margin:0 0 4px;text-align:center}.err{color:var(--rd);margin-top:10px;min-height:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}.cards .card{margin-bottom:0}
.kpi b{display:block;font-size:24px;margin-top:4px}.kpi span{color:var(--mute);font-size:12px;display:block}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;background:#e8ecf2;white-space:nowrap}
.d-ok{color:var(--gr);font-weight:600}.d-warn{color:var(--am);font-weight:600}.d-bad{color:var(--rd);font-weight:700}
.ok{color:var(--gr)}.wr{color:var(--am)}.txbad{color:var(--rd)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eef1f7;margin:6px 0 4px}.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}.chip b{font-size:14px;margin-right:4px}
.prog{height:10px;background:#e8ecf2;border-radius:6px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--pri);width:0}
.tabbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tabbar input{max-width:260px}.tabbar select{max-width:250px;width:auto}.sp{flex:1}
.drop2{border:2px dashed #aab7d4;border-radius:8px;padding:26px;text-align:center;color:var(--mute);background:#fafbfe}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.navbar{margin:8px 12px 0}}
@media print{nav#nav,.navbar,#mn,.noprint,.login{display:none!important}}
/* ===== Sorting tabel stok, dashboard, cetak dashboard ===== */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{color:var(--pri)}
th.sortable.asc::after{content:' ▲';font-size:10px}th.sortable.desc::after{content:' ▼';font-size:10px}
table.st td{vertical-align:top}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.dgrid .card{margin-bottom:0}
.chbox{position:relative;height:250px;margin:8px 0}
.dtitle{margin:2px 0 12px}
table.mini{min-width:0;font-size:12.5px}table.mini th,table.mini td{padding:5px 8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
td.hot{background:#fdeceb}
ul.ins{margin:6px 0 0;padding-left:18px}ul.ins li{margin:3px 0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
@media print{
  body.pd #mn{display:block!important}
  body.pd #trk,body.pd .rtitle,body.pd footer.credit,body.pd .tabbar,body.pd .noprint{display:none!important}
  body.pd .dgrid{grid-template-columns:1fr 1fr}
  body.pd .card{break-inside:avoid;border-color:#bbb}
  body.pd .chbox{height:220px}
  body.pd .cards{grid-template-columns:repeat(4,1fr)}
}
.hide{display:none!important}
nav#nav a{padding:10px 10px}

/* tabel Stok & Aging: header beku (sticky) + kolom rata tengah */
.tw-scroll{max-height:calc(100vh - 70px);overflow:auto}
.tw-scroll thead th{position:sticky;top:0;z-index:3;background:#f6f8fb;box-shadow:0 1px 0 var(--line)}
th.ctr,td.ctr{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<!-- OCR (Batch MSR dari screenshot): butuh internet saat dipakai. Fitur lain jalan tanpa OCR. -->
<script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const SHELL = `
<header class="top">
  <img class="logo" src="img/logo.jpg" alt="Logo STP">
  <div class="brand"><div class="co">PT SEJAHTERA TRIDAYA PRIMA</div><h1>STP Parts</h1></div>
  <section class="stats" id="stats"></section>
</header>
<div class="navbar"><nav id="nav"></nav><div class="user" id="who"></div></div>
<!-- Kop surat: hanya tampil saat Export PDF / Print -->
<div class="kop" style="padding:0 0 6px;margin:0 0 8px">
  <img class="k-logo" src="img/logo.jpg" alt="Logo STP">
  <div class="k-mid">
    <div class="k-name">PT SEJAHTERA TRIDAYA PRIMA</div>
    <div class="k-addr">Plaza Aminta Lantai 2, Suite 202 Jl. Let. Jend. TB. Simatupang Kav. 10<br>Kel. Pondok Pinang, Kec. Kebayoran Lama, Jakarta Selatan 12310<br>Email: info@sejahtera-eng.com | Website: www.stp-pumps.com<br>Telp: 021–7511422, Fax: 021–7511421</div>
  </div>
  <div class="k-cert"><img src="img/smk3.png" alt="SMK3"><img src="img/tuvsud.jpg" alt="TUV SUD"><img src="img/iso14001.png" alt="Accredited ISO 14001"></div>
</div>
<h2 class="rtitle">STP Parts · Spareparts Follow-up Tracker <small id="pdate"></small></h2>
<main id="trk">
  <div class="bar noprint">
    <div class="bar-l">
      <input type="search" id="q" placeholder="Cari Part No, MSR, Vendor, atau Requester…">
      <select id="flt"><option value="all">Semua Status</option></select>
    </div>
    <div class="bar-r" id="topbtns"></div>
  </div>
  <p id="dbinfo" class="msg noprint" style="margin:0 0 8px;font-size:12px;min-height:0"></p>
  <div class="wrap"><table>
    <thead><tr><th data-sort="fu" title="Klik untuk mengurutkan">FU</th><th data-sort="part" title="Klik untuk mengurutkan">Detail Part</th><th data-sort="msr" title="Klik untuk mengurutkan">MSR / Vendor</th><th data-sort="req" title="Klik untuk mengurutkan">Requester</th><th data-sort="qty" title="Klik untuk mengurutkan">Qty / PO</th><th data-sort="stok" title="Klik untuk mengurutkan">Stok Gudang</th><th data-sort="status" title="Klik untuk mengurutkan">Status</th><th><span data-sort="last" title="Urutkan menurut tanggal FU terakhir (klik 1× = terlama di atas)">Follow-up Terakhir</span><span data-sort="next" class="sub" title="Urutkan menurut tanggal FU berikutnya"> · Berikutnya</span></th><th class="noprint">Aksi</th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <div id="printArea"></div>
</main>
<main id="mn" hidden></main>
<footer class="credit">STP Parts · PT Sejahtera Tridaya Prima · <b>Versi 2.3</b><br>Dikembangkan oleh Fadholi Ambar | Parts Analyst</footer>
<dialog id="dlg">
  <div class="dh"><h2 id="dT"></h2><button onclick="dlg.close()" aria-label="Tutup">✕</button></div>
  <div class="db" id="dB"></div>
</dialog>
<input type="file" id="csvFile" accept=".xlsx,.xls,.csv,.txt" hidden>
`;

const CFG = window.STP_CONFIG;
function cfgProblem(){
  if (!CFG || typeof CFG !== 'object') return 'File <b>config.js</b> tidak terbaca atau ada salah ketik (tanda kutip atau koma hilang), sehingga isinya tidak berjalan. Buka <a href="config.js" target="_blank">config.js</a> untuk memeriksa: isinya harus 4 baris yang diawali <code>window.STP_CONFIG = {</code> dan diakhiri <code>};</code>. Jika yang tampil malah halaman aplikasi, berarti file config.js tidak ada di folder <b>public</b>.';
  const url = String(CFG.url || '').trim(), key = String(CFG.key || '').trim();
  if (!url || url.startsWith('GANTI')) return '<b>Project URL</b> di config.js belum diisi (masih tulisan GANTI_...).';
  if (!key || key.startsWith('GANTI')) return '<b>Publishable key</b> di config.js belum diisi (masih tulisan GANTI_...).';
  if (!(/^https:\/\/[^\s\/]+\.[^\s\/]+\/?$/i.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/i.test(url))) return '<b>Project URL</b> tampak salah. Harus berbentuk <code>https://xxxxxxxxxx.supabase.co</code>, tanpa spasi, tanpa tambahan di belakang. Yang terbaca: <code>' + url.slice(0, 60).replace(/[<>&"]/g, '') + '</code>';
  if (/^sb_secret_/.test(key)) return 'Key yang diisi adalah <b>secret key</b>. Jangan dipakai di aplikasi. Ganti dengan <b>Publishable key</b> (diawali sb_publishable_).';
  if (key.startsWith('eyJ')) { try { const r = JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role; if (r === 'service_role') return 'Key yang diisi adalah <b>service_role (secret)</b>. Jangan dipakai di aplikasi. Ganti dengan Publishable key atau anon key.'; } catch(e){} }
  else if (!/^sb_publishable_/.test(key)) return '<b>Key</b> tampak salah. Pakai Publishable key (diawali <code>sb_publishable_</code>) atau anon key (diawali <code>eyJ</code>).';
  return '';
}
const CFG_ERR = cfgProblem();
if (CFG_ERR) {

  const out = []; let from = 0;
  for (;;){ const { data, error } = await make().range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; from += 1000; }
  return out;
}
const csvText = (head, lines) => { const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"'; return '\uFEFF' + [head.map(q).join(','), ...lines.map(l => l.map(q).join(','))].join('\r\n'); };
const csvDownload = (name, head, lines) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csvText(head, lines)], {type:'text/csv;charset=utf-8'})); a.download = name; a.click(); };

/* =====================================================================
   MODUL FOLLOW-UP TRACKER (dipindahkan dari sparepart-tracker.html ke database Supabase)
   ===================================================================== */
function createTracker() {
  const CRIT = 3, NEXT_DAYS = 7, NEXT_DAYS_URGENT = 3, STALE_DAYS = 7;
  const PART = 'Sebagian Diterima';
  const STATUS = ['Belum Diterima', PART, 'Sudah Diterima'];
  const $ = s => document.querySelector(s);
  const dlg = $('#dlg');
  const esc = escH;
  let reqs = [], items = [], stockMeta = null, wired = false;
  const stockCache = new Map();

  /* ----- helper tanggal & status (dari file asli) ----- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => ymd(new Date());
  const parseD = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
  const dayDiff = s => Math.round((parseD(today()) - parseD(s)) / 864e5);
  const addDays = (s, n) => { const d = parseD(s || today()); d.setDate(d.getDate() + n); return ymd(d); };
  const fmt = d => d ? new Date(d).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : '-';
  const fmtTs = d => new Date(d).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const last = i => i.logs[i.logs.length - 1] || {};
  const done = i => i.status === 'Sudah Diterima';
  const isCrit = i => !done(i) && i.logs.length >= CRIT;
  const ageDays = i => last(i).date ? Math.max(0, dayDiff(last(i).date)) : 0;
  const isStale = i => !done(i) && ageDays(i) >= STALE_DAYS;
  const isDue = i => !done(i) && !!i.next && dayDiff(i.next) >= 0;
  const rcvOf = i => done(i) ? i.qty : i.status === PART ? (i.rcv || 0) : 0;
  const statusText = i => i.status === PART ? `Sebagian (${i.rcv || 0}/${i.qty})` : i.status;
  const statusBadge = i => done(i) ? '<span class="bd fu-ok">Sudah Diterima</span>'
    : i.status === PART ? `<span class="bd fu-part">Sebagian ${esc(i.rcv || 0)}/${esc(i.qty)}</span>` : '<span class="bd fu-warn">Belum Diterima</span>';
  const ageTxt = n => n === 0 ? 'hari ini' : n === 1 ? 'kemarin' : n + ' hari lalu';
  const ageBadge = i => { if (done(i)) return ''; const n = ageDays(i);
    return `<span class="bd ${n >= STALE_DAYS * 2 ? 'fu-bad' : n >= STALE_DAYS ? 'fu-warn' : 'fu-no'}">${ageTxt(n)}</span>`; };
  const nextBadge = i => { if (done(i) || !i.next) return ''; const n = -dayDiff(i.next);
    return `<small class="nx">FU berikutnya: ${fmt(i.next)} <span class="bd ${n < 0 ? 'fu-bad' : n === 0 ? 'fu-warn' : 'fu-ok'}">${n < 0 ? 'Terlambat ' + (-n) + ' hari' : n === 0 ? 'Hari ini' : n === 1 ? 'Besok' : n + ' hari lagi'}</span></small>`; };
  const FILTERS = [['all', 'Semua Status'], ['belum', 'Belum Diterima (termasuk sebagian)'], ['sebagian', 'Sebagian Diterima'], ['sudah', 'Sudah Diterima'],
    ['crit', `Perlu Perhatian (FU ≥ ${CRIT}x)`], ['due', 'Jatuh tempo FU (hari ini / terlewat)'], ['stale', `Lama tidak di-FU (≥ ${STALE_DAYS} hari)`], ['urgent', 'Urgent']];
  const filterOpts = sel => FILTERS.map(([v, t]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const matchStatus = (i, k) => !k || k === 'all' || (k === 'belum' && !done(i)) || (k === 'sebagian' && i.status === PART) || (k === 'sudah' && done(i)) ||
    (k === 'crit' && isCrit(i)) || (k === 'due' && isDue(i)) || (k === 'stale' && isStale(i)) || (k === 'urgent' && i.urgent);
  let sort = { k: '', dir: 1 };
  const SORTERS = { fu: i => i.logs.length, part: i => i.part, msr: i => i.msr, req: i => i.req, qty: i => +i.qty || 0,
    stok: i => stockOf(i).total ?? -1, status: i => done(i) ? 2 : i.status === PART ? 1 : 0, last: i => last(i).date || '', next: i => i.next || '' };
  const cmp = (a, b) => typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b), 'id', { numeric: true, sensitivity: 'base' });
  const NEXT_HINT = `Default H+${NEXT_DAYS} dari tanggal FU; item urgent H+${NEXT_DAYS_URGENT} (otomatis, tetap bisa diubah).`;
  const defNext = (dateStr, urgent) => addDays(dateStr || today(), urgent ? NEXT_DAYS_URGENT : NEXT_DAYS);
  const nextField = (val, hint) => `<div class="full"><label>FU berikutnya (opsional)<input name="next" type="date" value="${esc(val || '')}"></label>
    <div class="qd">Cepat: <button type="button" data-addd="1">+1 hari</button><button type="button" data-addd="3">+3 hari</button><button type="button" data-addd="7">+7 hari</button><button type="button" data-addd="0">Kosongkan</button>${hint ? `<span>· ${hint}</span>` : ''}</div></div>`;
  const wireNext = () => document.querySelectorAll('[data-addd]').forEach(b => b.onclick = () => {
    const f = b.closest('form'), base = f.querySelector('[name=date]'), n = +b.dataset.addd, nx = f.querySelector('[name=next]');
    nx.value = n ? addDays(base ? base.value : today(), n) : ''; nx.dataset.touched = '1';
  });
  const wireAutoNext = f => {
    const date = f.querySelector('[name=date]'), nx = f.querySelector('[name=next]'), urg = f.querySelector('[name=urgent]');
    const upd = () => { if (!nx.dataset.touched) nx.value = defNext(date && date.value, urg && urg.checked); };
    nx.addEventListener('input', () => nx.dataset.touched = '1');
    [date, urg].forEach(e => e && ['input', 'change'].forEach(ev => e.addEventListener(ev, upd)));
    upd();
  };
  const wireRcv = f => { const st = f.querySelector('[name=status]'), l = f.querySelector('.rcvL'); const t = () => l.hidden = st.value !== PART; st.onchange = t; t(); };
  const readRcv = (d, qty) => {
    if (d.status === 'Sudah Diterima') return { ok: true, rcv: qty };
    if (d.status !== PART) return { ok: true, rcv: 0 };
    const r = parseFloat(d.rcv);
    if (!(r > 0 && r < qty)) { alert(`Untuk "Sebagian Diterima", isi qty yang sudah diterima antara 0 dan ${qty} (qty MSR). Jika semuanya sudah datang, pilih "Sudah Diterima".`); return { ok: false }; }
    return { ok: true, rcv: r };
  };
  const opts = (list, sel) => list.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');
  const reqOpts = sel => opts([...new Set([...reqs, sel].filter(Boolean))], sel) + '<option value="__new__">+ Tambah requester baru…</option>';
  const applyReqs = (i, arr) => { i.reqs = [...new Set(arr)]; i.req = i.reqs.join(', '); };
  const reqInline = i => i.reqs.map((r, k) => `<div class="rr"><select data-id="${i.id}" data-k="${k}" data-f="rn" title="${esc(r)}">${reqOpts(r)}</select>
    <button class="d" data-act="rmreq" data-id="${i.id}" data-k="${k}" title="Hapus requester ini">✕</button></div>`).join('')
    + `<button class="addq" data-act="addreq" data-id="${i.id}">+ Requester</button>`;
  const reqCell = i => i.reqs.map(esc).join('<br>');
  const reqRow = n => `<div class="rr"><select data-k="n">${reqOpts(n)}</select><button type="button" class="d" data-rmrow title="Hapus baris">✕</button></div>`;
  const reqBlock = (arr = ['']) => `<div class="full"><b>Requester</b> <small class="msg">(boleh lebih dari satu)</small>
    <div id="rrows">${arr.map(reqRow).join('')}</div>
    <div class="rr-foot"><button type="button" id="addReq">+ Tambah requester</button></div></div>`;
  const readReqs = () => [...new Set([...document.querySelectorAll('#rrows [data-k=n]')].map(e => e.value).filter(n => n && n !== '__new__'))];
  const wireReqs = () => {
    $('#addReq').onclick = () => $('#rrows').insertAdjacentHTML('beforeend', reqRow(reqs.find(r => !readReqs().includes(r)) || ''));
    $('#rrows').addEventListener('click', e => {
      const b = e.target.closest('[data-rmrow]'); if (!b) return;
      if (document.querySelectorAll('#rrows .rr').length > 1) b.closest('.rr').remove();
    });
  };
  function modal(title, html) { dlg.classList.remove('wide'); $('#dT').textContent = title; $('#dB').innerHTML = html; if (!dlg.open) dlg.showModal(); }
  const form = (id, fn) => $(id).addEventListener('submit', async e => {
    e.preventDefault(); const btn = e.submitter; if (btn) btn.disabled = true;
    try { await fn(Object.fromEntries(new FormData(e.target))); }
    catch (err) { alert('Gagal menyimpan: ' + (err.message || err)); await reload(); }
    finally { if (btn) btn.disabled = false; }
  });

  /* ----- pemetaan data <-> database ----- */
  const okStatus = s => STATUS.includes(s) ? s : 'Belum Diterima';
  const okDate = s => /^\d{4}-\d{2}-\d{2}/.test(String(s || '')) ? String(s).slice(0, 10) : null;
  const fixItem = i => {
    i.part = i.part ?? ''; i.desc = i.desc ?? ''; i.msr = i.msr ?? ''; i.vendor = i.vendor ?? '';
    i.status = okStatus(i.status); i.po = i.po ?? ''; i.stock = i.stock ?? null; i.qty = parseFloat(i.qty) || 1;
    i.urgent = !!i.urgent; i.next = i.next || ''; i.rcv = i.status === 'Sudah Diterima' ? i.qty : (parseFloat(i.rcv) || 0);
    i.logs = Array.isArray(i.logs) ? i.logs : [];
    i.reqs = [...new Set((i.reqs || [i.req || '-']).map(r => typeof r === 'string' ? r : r.n))];
    i.req = i.reqs.join(', ');
    return i;
  };
  const mapLog = l => ({ id: l.id, date: l.log_date, status: l.status, po: l.po || '', note: l.note || '', rcv: +l.rcv || 0, next: l.next_fu || '', edits: l.edits || [], imported: l.imported, by: l.created_by, at: l.created_at });
  const mapItem = (r, logs) => fixItem({ id: r.id, part: r.part, desc: r.descr || '', msr: r.msr, vendor: r.vendor || '', qty: +r.qty, po: r.po || '', stock: r.stock_manual == null ? null : +r.stock_manual,
    status: r.status, rcv: +r.rcv, urgent: r.urgent, next: r.next_fu || '', reqs: r.reqs || [], legacy: r.legacy_id, logs: (logs || []).map(mapLog) });
  const itemRow = i => ({ part: i.part, descr: i.desc, msr: i.msr, vendor: i.vendor || null, qty: i.qty, po: i.po || null, stock_manual: i.stock, status: i.status,
    rcv: i.rcv || 0, urgent: !!i.urgent, next_fu: i.next || null, reqs: i.reqs });
  const logRow = l => ({ log_date: okDate(l.date) || today(), status: okStatus(l.status), po: l.po || null, note: l.note || '', rcv: +l.rcv || 0, next_fu: okDate(l.next), edits: l.edits || [] });
  const chk = r => { if (r.error) throw r.error; return r; };

  async function load() {
    const [rq, its, lgs, meta] = await Promise.all([
      sb.from('requesters').select('name').order('name'),
      fetchAll(() => sb.from('followup_items').select('*').order('id', { ascending: false })),
      fetchAll(() => sb.from('followup_logs').select('*').order('id')),
      sb.from('stock_qty_meta').select('*').maybeSingle()]);
    reqs = (rq.data || []).map(r => r.name);
    const by = {}; lgs.forEach(l => (by[l.item_id] = by[l.item_id] || []).push(l));
    items = its.map(r => mapItem(r, by[r.id]));
    stockMeta = meta.data || null;
    await ensureStock(items.map(i => i.part));
  }
  const reload = async () => { try { await load(); } catch (e) { alert('Gagal memuat data: ' + e.message); } render(); };
  const persistItem = async i => chk(await sb.from('followup_items').update(itemRow(i)).eq('id', i.id));

  // Membuat item baru (beserta log pertama). list = urutan tampil (yang pertama paling atas)
  async function createItems(list, imported) {
    const rev = [...list].reverse();
    for (let s = 0; s < rev.length; s += 200) {
      const part = rev.slice(s, s + 200);
      const ins = chk(await sb.from('followup_items').insert(part.map(i => ({ ...itemRow(i), legacy_id: i.legacyKey || null }))).select('id')).data.map(r => r.id).sort((a, b) => a - b);
      part.forEach((i, k) => i.id = ins[k]);
      const logs = part.flatMap(i => i.logs.map(l => ({ ...logRow(l), item_id: i.id, imported: !!imported })));
      for (let t = 0; t < logs.length; t += 500) chk(await sb.from('followup_logs').insert(logs.slice(t, t + 500)));
    }
    await reload();   // ambil ulang agar id log & cap waktu server ikut
  }
  const newItem = (d, note) => {
    const it = { part: d.part, desc: d.desc, msr: d.msr, vendor: d.vendor, qty: parseFloat(d.qty) || 1, po: (d.po || '').trim(), stock: null,
      status: STATUS[0], rcv: 0, urgent: !!d.urgent, next: d.next || '', logs: [{ date: d.date, status: STATUS[0], po: (d.po || '').trim(), note, rcv: 0, next: d.next || '' }] };
    applyReqs(it, d.reqs || [d.req]); return it;
  };

  /* ----- database stok Accurate (tersimpan di server, dipakai bersama) ----- */
  const norm = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const dbGet = part => { const m = stockCache.get(norm(part)); return m ? { total: m.total, wh: m.wh, name: m.nama } : null; };
  async function ensureStock(parts) {
    const need = [...new Set(parts.map(norm).filter(k => k && !stockCache.has(k)))];
    for (let s = 0; s < need.length; s += 60) {
      const ch = need.slice(s, s + 60), r = await sb.from('stock_qty').select('*').in('kode_norm', ch);
      if (r.error) return; const got = new Set();
      (r.data || []).forEach(x => { stockCache.set(x.kode_norm, x); got.add(x.kode_norm); });
      ch.forEach(k => { if (!got.has(k)) stockCache.set(k, null); });
    }
  }
  const stockOf = i => dbGet(i.part) || { total: i.stock, wh: i.wh };
  const chips = wh => wh && Object.keys(wh).length ? `<div class="whs">${Object.entries(wh).map(([k, v]) => `<span class="wh ${v > 0 ? 'on' : ''}" title="Gudang ${esc(k)}">${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>` : '';
  const stockMini = part => {
    if (!String(part || '').trim()) return '';
    const m = dbGet(part);
    return m ? `<span class="bd ${m.total > 0 ? 'fu-ok' : 'fu-bad'}">Total ${m.total}</span>` + chips(m.wh)
             : `<small>${stockMeta ? 'tidak ada di database' : 'database belum diupload'}</small>`;
  };
  const hint = part => {
    if (!String(part || '').trim()) return '';
    const m = dbGet(part);
    if (!stockMeta) return '<span class="msg">Database stok belum diupload (tombol Sync Stok Accurate).</span>';
    if (!m) return '<span class="msg">Part ini tidak ditemukan di database stok Accurate.</span>';
    return `<b>Stok gudang saat ini: Total ${esc(m.total)}</b>${chips(m.wh)}${m.name ? `<small>${esc(m.name)}</small>` : ''}`;
  };
  const debounced = (el, fn) => { clearTimeout(el._t); el._t = setTimeout(fn, 250); };

  /* ===== RENDER ===== */
  function render() {
    const q = $('#q').value.toLowerCase(), f = $('#flt').value;
    const list = items.filter(i => [i.part, i.msr, i.vendor, i.req, i.desc].join(' ').toLowerCase().includes(q) && matchStatus(i, f));
    if (sort.k) {
      const g = SORTERS[sort.k];
      list.sort((a, b) => { if (sort.k === 'next' && (!a.next || !b.next)) return (!a.next - !b.next); return cmp(g(a), g(b)) * sort.dir; });
    }

  async function runOCR(file) {
    const msg = $('#msg');
    if (typeof Tesseract === 'undefined') { msg.textContent = 'Tesseract belum termuat. Cek koneksi internet lalu muat ulang halaman.'; return; }
    msg.textContent = 'Membaca gambar…';
    try {
      const data = await recog(file, msg);
      const rows = parseOCR(data.text);
      if (!rows.length) { msg.textContent = 'Tidak ada baris terbaca. Coba screenshot yang lebih jelas atau isi manual.'; return; }
      await ensureStock(rows.map(r => r.part));
      $('#rows').innerHTML = rows.map(r => batchRow({ ...r, urgent: $('#allUrg').checked })).join('');
      msg.textContent = `${rows.length} baris terbaca. Periksa dan revisi bila perlu.`;
    } catch (err) {
      msg.textContent = 'OCR gagal: ' + err.message + '. Pastikan perangkat terhubung internet (OCR memuat data bahasa saat pertama kali dipakai). Sementara itu, isi baris secara manual.';
    }
  }
  async function recog(file, msg) {
    const logger = m => m.status === 'recognizing text' && (msg.textContent = `Membaca teks… ${Math.round(m.progress * 100)}%`);
    try { return (await Tesseract.recognize(file, 'eng', { logger })).data; }
    catch (e) {
      const js = await (await fetch('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js')).text();
      const workerPath = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
      return (await Tesseract.recognize(file, 'eng', { logger, workerPath, workerBlobURL: false })).data;
    }
  }
  function parseOCR(text) {
    const qRe = /(\d+(?:[.,]\d+)?)\s*(?:set|pcs|pes|pc|unit|ea|buah|ltr|kg|mtr|roll|pack|bh|lbr)\b/i;
    const clean = t => t.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '').toUpperCase();
    const fix = t => /^[0-9OIL|]{7,}$/.test(t) && (t.match(/\d/g) || []).length >= t.length * 0.4 ? t.replace(/O/g, '0').replace(/[IL|]/g, '1') : t;
    const isCode = t => /^(?=.*\d)(?=.*[A-Z])[A-Z0-9-]{6,}$/.test(t) || /^\d{7,}$/.test(t);
    return text.split('\n').map(l => l.trim()).filter(l => l.length > 4).map(l => {
      let q = l.match(qRe), qty = q ? q[1] : '', body = q ? l.slice(0, q.index) : l;
      if (!q) { const m = l.match(/\s(\d{1,5}(?:[.,]\d+)?)\s*$/); if (m) { qty = m[1]; body = l.slice(0, m.index); } }
      const toks = [...body.matchAll(/\S+/g)].map(m => ({ s: m[0], i: m.index, c: fix(clean(m[0])) }));
      const codes = toks.filter(t => isCode(t.c));
      const code = codes[codes.length - 1];
      if (!code && !qty) return null;
      let desc = body;
      if (code) desc = code.i < 3 ? body.slice(code.i + code.s.length) : body.slice(0, code.i);
      desc = desc.replace(/[|_]+/g, ' ').replace(/^[\s\-–:,]+|[\s\-–:,]+$/g, '').replace(/\s+/g, ' ');
      return { desc, part: code ? code.c : '', qty: qty.replace(',', '.') };
    }).filter(Boolean);
  }

  /* ===== SYNC STOK ACCURATE (laporan Kuantitas Barang per Gudang) ===== */
  function syncForm() {
    modal('Sync Stok Accurate', `<p>Unggah laporan <b>Kuantitas Barang per Gudang</b> dari Accurate (Excel .xlsx/.xls atau CSV). File ini disimpan di server sebagai <b>database stok bersama</b>: stok per gudang tampil otomatis di tabel dan saat menginput item, untuk semua pengguna. Setiap upload baru menggantikan database sebelumnya, jadi unggah rutin agar stok tetap terbaru.</p>
      <div class="ft"><button type="button" onclick="dlg.close()">Batal</button><button class="p" id="pick">Pilih file Excel / CSV</button></div>`);
    $('#pick').onclick = () => $('#csvFile').click();
  }
  const splitCSV = (line, sep) => {
    const out = []; let cur = '', q = false;
    for (const c of line) { if (c === '"') q = !q; else if (c === sep && !q) { out.push(cur); cur = ''; } else cur += c; }
    return out.push(cur), out.map(s => s.trim());
  };
  const toNum = v => {
    v = String(v).replace(/[^\d.,-]/g, '');
    v = /,\d{1,2}$/.test(v) ? v.replace(/\./g, '').replace(',', '.') : v.replace(/,/g, '');
    return parseFloat(v);
  };
  async function uploadStock(map, file, whList) {
    const entries = Object.entries(map).map(([k, v]) => ({ kode_norm: k, kode: v.c || '', nama: v.n || '', total: v.t, wh: v.w }));
    for (let s = 0; s < entries.length; s += 2000) {
      modal('Hasil Sync', `<p>Mengunggah ke server… ${Math.min(s + 2000, entries.length)} / ${entries.length} barang</p>`);
      chk(await sb.rpc('replace_stock_qty', { p_reset: s === 0, p_rows: entries.slice(s, s + 2000) }));
    }
    chk(await sb.from('stock_qty_meta').upsert({ id: 1, file, synced_at: new Date().toISOString(), wh: whList, items: entries.length, synced_by: me.id }));
    stockCache.clear(); stockMeta = (await sb.from('stock_qty_meta').select('*').maybeSingle()).data;
    await ensureStock(items.map(i => i.part)); render();
  }
  async function onStockFile(e) {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    let rows;
    try {
      if (/\.xlsx?$/i.test(file.name)) {
        if (typeof XLSX === 'undefined') return alert('Pembaca Excel belum termuat. Muat ulang halaman.');
        const wb = XLSX.read(await file.arrayBuffer());
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      } else {
        const lines = (await file.text()).replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
        const sep = [';', '\t', ','].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
        rows = lines.map(l => splitCSV(l, sep));
      }
    } catch (err) { return alert('File tidak bisa dibaca: ' + err.message); }
    const kodeRe = /kode|part|no\.? ?barang|item/, stokRe = /stok|stock|kuantitas|qty|jumlah|saldo/;
    const whRe = /^\(?\s*([a-z])\s*\)?(\s|$)/i;
    const low = r => r.map(c => String(c).toLowerCase().replace(/\s+/g, ' ').trim());
    const isHead = r => { const h = low(r).filter(c => c.length < 60);
      return h.some(c => kodeRe.test(c)) && (h.some(c => stokRe.test(c) || /total/.test(c)) || h.some(c => whRe.test(c))); };
    let hi = rows.findIndex(isHead); if (hi < 0) hi = 0;
    const head = low(rows[hi] || []);
    let ci = head.findIndex(h => /kode|part/.test(h)); if (ci < 0) ci = head.findIndex(h => kodeRe.test(h));
    if (ci < 0) ci = 0;
    const whCols = {};
    head.forEach((h, k) => { const m = h.match(whRe); if (m && k !== ci && !(m[1].toUpperCase() in whCols)) whCols[m[1].toUpperCase()] = k; });
    let ti = head.findIndex(h => /total/.test(h));
    if (ti < 0 && !Object.keys(whCols).length) { ti = head.findIndex(h => /stok|stock|saldo/.test(h)); if (ti < 0) ti = head.findIndex(h => stokRe.test(h)); if (ti < 0) ti = 1; }
    const ni = head.findIndex(h => /^nama barang|^nama item|^deskripsi|^description/.test(h));
    const map = {}, samples = [];
    rows.slice(hi + 1).forEach(c => {
      const code = String(c[ci] ?? '').trim(); if (!code) return;
      const w = {}; Object.entries(whCols).forEach(([g, idx]) => { const n = toNum(c[idx]); w[g] = isNaN(n) ? 0 : n; });
      let total = ti >= 0 ? toNum(c[ti]) : NaN;
      if (isNaN(total) && Object.keys(w).length) total = Object.values(w).reduce((a, b) => a + b, 0);
      if (isNaN(total)) return;
      map[norm(code)] = { t: total, w: Object.keys(w).length ? w : null, n: ni >= 0 ? String(c[ni] ?? '').trim() : '', c: code };
      if (samples.length < 3) samples.push(code);
    });
    if (!Object.keys(map).length) return modal('Hasil Sync', '<p>Tidak ada baris barang yang terbaca. Pastikan file berisi kolom “Kode Barang” dan kolom stok/gudang.</p><div class="ft"><button class="p" onclick="dlg.close()">Tutup</button></div>');
    try { await uploadStock(map, file.name, Object.keys(whCols)); }
    catch (err) { return modal('Hasil Sync', `<p class="txbad">Gagal menyimpan ke server: ${esc(err.message || err)}</p><div class="ft"><button class="p" onclick="dlg.close()">Tutup</button></div>`); }
    const hit = items.filter(i => dbGet(i.part)).length;
    modal('Hasil Sync', `<p>Database stok diperbarui: <b>${Object.keys(map).length}</b> barang. Di tracker, <b>${hit}</b> dari ${items.length} part cocok.</p>
      <p class="msg">Kolom kode: “${esc(head[ci])}” · kolom total: “${esc(ti >= 0 ? head[ti] : 'jumlah semua gudang')}”<br>Gudang terbaca: ${esc(Object.keys(whCols).join(', ') || 'tidak ada')}<br>Contoh kode terbaca: ${esc(samples.join(', '))}</p>
      ${hit === 0 && items.length ? '<p class="msg">Tidak ada part tracker yang cocok. Cek apakah Part No sama dengan Kode Barang di Accurate (tanda strip dan spasi diabaikan).</p>' : ''}
      <div class="ft"><button class="p" onclick="dlg.close()">Selesai</button></div>`);
  }

  function buildPrint(list, fd) {

  function backupForm() {
    modal('Backup / Restore Data', `<p>File backup berisi <b>semua data follow-up</b> (${items.length} item) dan daftar requester, dalam format yang sama dengan file tracker lama. Fitur Restore bisa dipakai untuk <b>memindahkan data dari tracker lama (file HTML)</b> ke STP Parts.</p>

    };

      } catch (err) { alert('Gagal: ' + err.message); await reload(); }

const BK = [['b1','1-30 hari','#6cc08b'],['b2','31-60','#b5d86a'],['b3','61-90','#f0c24b'],['b4','91-120','#ee9a45'],['b5','>120 hari','#d9534f']];
const STAT = ['Fast Moving','Medium Moving','Slow Moving','Dead Stock'];

const STAT_CLS = { 'Fast Moving':'fu-ok', 'Medium Moving':'fu-part', 'Slow Moving':'fu-warn', 'Dead Stock':'fu-bad' };
const normKode = s => String(s ?? '').trim().toUpperCase();   // kunci cocok persis seperti Excel (tanda strip tidak dihapus)

/* --- aturan status (sama dengan sheet Spareparts di Excel Anda) --- */
function agingStatus(r){            // berdasarkan umur stok (bucket hari)
  if (r._dead) return 'Dead Stock';
  if ((r.b5||0) > 0) return 'Slow Moving';
  if ((r.b4||0) > 0) return 'Medium Moving';
  if ((r.b1||0) + (r.b2||0) + (r.b3||0) > 0) return 'Fast Moving';
  return 'Slow Moving';
}
function saleStatus(r){             // berdasarkan hari sejak transaksi penjualan terakhir
  if (r._dead) return 'Dead Stock';
  if (!r._sale || !r._sale.last_date) { r._days = null; return 'Slow Moving'; }   // belum pernah terjual
  const d = Math.round((Date.parse(String(r.as_of).slice(0,10)) - Date.parse(String(r._sale.last_date).slice(0,10))) / 864e5);
  r._days = d; return d <= 90 ? 'Fast Moving' : d <= 120 ? 'Medium Moving' : 'Slow Moving';
}
function annotate(r){
  r._k = normKode(r.kode); r._sale = salesMap.get(r._k) || null; r._dead = !!(flagMap.get(r._k) || {}).dead_stock;
  r._ag = agingStatus(r); r._sl = saleStatus(r); r._last = r._sale ? r._sale.last_date : null;
  r._umur = r.stok > 0 ? ((r.b1||0)*15 + (r.b2||0)*45 + (r.b3||0)*75 + (r.b4||0)*105 + (r.b5||0)*135) / r.stok : 0;
}

let parsed = null, lastFile = null;

const MON = {jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,agt:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function parseAging(wb){
  const ws = wb.Sheets[wb.SheetNames[0]], rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const hi = rows.findIndex(r => r && String(r[0] ?? '').trim().toLowerCase() === 'kode barang');
  if (hi < 0) throw new Error('Judul kolom "Kode Barang" tidak ditemukan. Pastikan ini file Umur Persediaan dari software akuntansi.');
  const meta = rows.slice(0, hi).flat().filter(x => typeof x === 'string').join(' | ');
  const dm = meta.match(/Per\s*Tgl\.?\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/i);
  if (!dm || !MON[dm[2].slice(0,3).toLowerCase()]) throw new Error('Tanggal "Per Tgl. ..." tidak terbaca di bagian atas file.');
  const asOf = `${dm[3]}-${String(MON[dm[2].slice(0,3).toLowerCase()]).padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
  const head = rows[hi].map(h => String(h ?? '').replace(/\s+/g,' ').trim()), idx = n => head.findIndex(h => h.toLowerCase() === n.toLowerCase());
  const c = { kode:idx('Kode Barang'), nama:idx('Nama Barang'), satuan:idx('Satuan'), kategori:idx('Nama Kategori Barang'), nsat:idx('Nilai Satuan'), ntot:idx('Nilai Total'),
              b1:idx('1 - 30'), b2:idx('31 - 60'), b3:idx('61 - 90'), b4:idx('91 - 120'), b5:idx('> 120') };
  const miss = Object.entries(c).filter(([k,v]) => v < 0).map(([k]) => k);
  if (miss.length) throw new Error('Kolom tidak ditemukan: ' + miss.join(', ') + '. Format file berbeda dari contoh.');
  const sc = head.map((h,i) => ({h,i})).filter(x => /^stok\b/i.test(x.h));
  const gm = meta.match(/Gudang\s*:\s*\(\s*([A-Za-z0-9]+)\s*\)/i);
  if (sc.length !== 1) throw new Error(`File memuat ${sc.length} kolom Stok (${sc.map(x=>x.h).join(', ')}). Saat ini aplikasi baru mendukung satu gudang per file. Kirim contoh file ini ke pengembang agar dapat disesuaikan.`);
  const g = (head[sc[0].i].replace(/^stok\s*/i,'') || (gm && gm[1]) || '').toUpperCase();
  const warnings = []; if (gm && gm[1].toUpperCase() !== g) warnings.push(`Gudang di judul file (${gm[1]}) berbeda dengan kolom stok (${g}). Dipakai: ${g}.`);
  if (!ALL_G.includes(g)) throw new Error(`Gudang "${g}" belum terdaftar di aplikasi (terdaftar: ${ALL_G.join(', ')}).`);
  const n = v => { const x = Number(v); return isFinite(x) ? x : 0; }, map = new Map(); let fileRows = 0;
  for (const r of rows.slice(hi + 1)){
    const kode = String(r[c.kode] ?? '').trim(); if (!kode) continue; fileRows++;
    const o = { kode, nama:String(r[c.nama] ?? '').trim(), satuan:String(r[c.satuan] ?? '').trim(), kategori:String(r[c.kategori] ?? '').trim(),
      nilai_satuan:n(r[c.nsat]), nilai_total:n(r[c.ntot]), stok:n(r[sc[0].i]), b1:n(r[c.b1]), b2:n(r[c.b2]), b3:n(r[c.b3]), b4:n(r[c.b4]), b5:n(r[c.b5]) };
    if (!o.stok && !o.nilai_total) continue;
    if (map.has(kode)){ const p = map.get(kode); ['nilai_total','stok','b1','b2','b3','b4','b5'].forEach(k => p[k] += o[k]); warnings.push('Kode ganda digabung: ' + kode); }
    else map.set(kode, o);
  }
  const out = [...map.values()]; out.forEach(o => o.selisih = Math.round((o.nilai_total - o.nilai_satuan * o.stok) * 100) / 100);
  return { gudang:g, asOf, fileRows, rows:out, warnings };
}
async function readFile(file){
  const pv = $$('#pv'); pv.innerHTML = '<div class="meta" style="margin-top:12px">Membaca file...</div>'; parsed = null; lastFile = file;

function toYMD(v){
  if (v instanceof Date && !isNaN(v)){ const d = new Date(v.getTime() + 12*3600e3); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  if (typeof v === 'number' && v > 20000 && v < 80000){ const p = XLSX.SSF.parse_date_code(v); return p ? `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}` : null; }
  const s = String(v ?? '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function parseSales(wb){
  const ws = wb.Sheets[wb.SheetNames[0]], rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const low = r => r.map(c => String(c ?? '').toLowerCase().replace(/\s+/g,' ').trim());
  const hi = rows.findIndex(r => { const h = low(r); return h.includes('tanggal') && h.some(c => /^kode( #| barang)?$/.test(c)); });
  if (hi < 0) throw new Error('Judul kolom "Tanggal" dan "Kode #" tidak ditemukan. Pastikan ini laporan Rincian Pesanan Penjualan dari software akuntansi.');
  const h = low(rows[hi]), idx = re => h.findIndex(c => re.test(c));
  const c = { tgl:idx(/^tanggal$/), kode:idx(/^kode( #| barang)?$/), nama:idx(/^nama barang$/), qty:idx(/^kuantitas$/), ship:idx(/pengiriman/) };
  if (c.qty < 0) throw new Error('Kolom "Kuantitas" tidak ditemukan.');
  const warnings = []; if (c.ship < 0) warnings.push('Kolom "Nomor # Pengiriman Barang Terakhir" tidak ada: semua baris dihitung sebagai transaksi.');
  const map = new Map(); let fileRows = 0, used = 0, dmin = null, dmax = null;
  for (const r of rows.slice(hi + 1)){
    const kode = String(r[c.kode] ?? '').trim(); if (!kode) continue; fileRows++;
    if (c.ship >= 0 && !String(r[c.ship] ?? '').trim()) continue;            // hanya yang sudah ada pengiriman (aturan di Excel Anda)
    const d = toYMD(r[c.tgl]); if (!d) continue; used++;
    const q = Number(String(r[c.qty] ?? '0').replace(',', '.')) || 0, k = normKode(kode);
    let o = map.get(k); if (!o){ o = { kode_norm:k, kode, nama:c.nama >= 0 ? String(r[c.nama] ?? '').trim() : '', last_date:d, n_tx:0, qty_total:0, months:{} }; map.set(k, o); }
    if (d > o.last_date) o.last_date = d; o.n_tx++; o.qty_total += q; const mo = d.slice(0,7); o.months[mo] = (o.months[mo] || 0) + q;
    if (!dmin || d < dmin) dmin = d; if (!dmax || d > dmax) dmax = d;
  }
  if (!used) throw new Error('Tidak ada baris transaksi yang terbaca (tanggal atau kode kosong).');
  return { fileRows, used, parts:[...map.values()], dmin, dmax, warnings };
}

    <div class="card"><b>Status berdasarkan Penjualan</b>${hasSales ? `<div class="chbox"><canvas id="c2"></canvas></div>${stTable(S,'Status')}` : '<div class="meta" style="padding:30px 0">Data penjualan belum diunggah. Unggah laporan Rincian Pesanan Penjualan agar status ini terisi.</div>'}</div>
    <div class="card"><b>Sebaran ${qty?'unit':'nilai'} menurut umur persediaan</b><div class="chbox"><canvas id="c3"></canvas></div></div>
    <div class="card"><b>10 kategori terbesar (${qty?'unit':'nilai'}), dipecah menurut status aging</b><div class="chbox"><canvas id="c4"></canvas></div></div>
    ${gset.length > 1 ? `<div class="card" style="grid-column:1/-1"><b>${qty?'Unit':'Nilai'} per gudang menurut status aging</b><div class="chbox" style="height:230px"><canvas id="c5"></canvas></div></div>` : ''}
  </div>
  <div class="dgrid">
    <div class="card"><b>Matriks status: Aging (baris) &times; Penjualan (kolom)</b><div class="meta" style="margin:2px 0 6px">Jumlah SKU dan ${qty?'unit':'nilai'}. Sel merah di kanan bawah (Slow menurut aging <i>dan</i> penjualan) adalah kandidat utama untuk ditinjau.</div>
      <table class="mini"><thead><tr><th></th>${STAT.map(s=>`<th class="n">${s}</th>`).join('')}</tr></thead><tbody>${STAT.map(a => `<tr><td><i class="dot" style="background:${STAT_COL[a]}"></i>${a}</td>${STAT.map(s => `<td class="n ${(a==='Slow Moving'||a==='Dead Stock')&&(s==='Slow Moving'||s==='Dead Stock')?'hot':''}">${num(mx[a][s].n)}<small class="meta" style="display:block">${qty?num(mx[a][s].v):rpS(mx[a][s].v)}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="card"><b>10 part Slow / Dead Stock (aging) ${qty?'dengan unit':'dengan nilai'} terbesar</b>
      <table class="mini"><thead><tr><th>Kode</th><th>Nama</th><th class="n">${qty?'Stok':'Nilai'}</th><th>Penjualan</th></tr></thead><tbody>${top10.map(r => `<tr><td><b>${escH(r.kode)}</b></td><td>${escH(r.nama)}</td><td class="n">${qty?num(r.stok):rpS(r.nilai_total)}</td><td>${stBadge(r._sl)}</td></tr>`).join('') || '<tr><td colspan="4" class="meta">Tidak ada.</td></tr>'}</tbody></table></div>
  </div>
  <div class="meta" style="margin-top:6px">Aturan status: <b>Aging</b> = Slow bila ada stok umur &gt;120 hari, Medium bila ada stok 91&ndash;120 hari, selain itu Fast; Dead Stock = ditandai manual. <b>Penjualan</b> = Fast bila transaksi terakhir ≤ 90 hari, Medium ≤ 120 hari, Slow bila lebih lama atau belum pernah terjual (dihitung terhadap tanggal data stok).</div>`;
  if (typeof Chart === 'undefined'){ $$('#dash').insertAdjacentHTML('afterbegin', '<div class="card wr">Pustaka grafik tidak termuat (cek folder lib/chart.umd.min.js di GitHub).</div>'); return; }
  Chart.defaults.font.family = 'Segoe UI, system-ui, sans-serif'; Chart.defaults.animation = false;
  const fmtTip = c => ` ${c.label || c.dataset.label}: ${qty ? num(c.parsed.y ?? c.parsed.x ?? c.parsed) + ' unit' : rpS(c.parsed.y ?? c.parsed.x ?? c.parsed)}`;
  const base = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12 } }, tooltip:{ callbacks:{ label:fmtTip } } } };
  const money = v => qty ? num(v) : (Math.abs(v) >= 1e9 ? (v/1e9).toFixed(1) + ' M' : Math.abs(v) >= 1e6 ? (v/1e6).toFixed(0) + ' jt' : num(v));
  const add = (id, cfg) => { const el = document.getElementById(id); if (el) dashCharts.push(new Chart(el, cfg)); };
  add('c1', { type:'doughnut', data:{ labels:STAT, datasets:[{ data:STAT.map(s=>A[s].v), backgroundColor:STAT.map(s=>STAT_COL[s]) }] }, options:{ ...base, cutout:'58%' } });
  if (hasSales) add('c2', { type:'doughnut', data:{ labels:STAT, datasets:[{ data:STAT.map(s=>S[s].v), backgroundColor:STAT.map(s=>STAT_COL[s]) }] }, options:{ ...base, cutout:'58%' } });
  add('c3', { type:'bar', data:{ labels:BK.map(b=>b[1]), datasets:[{ label:unitLbl, data:buck, backgroundColor:BK.map(b=>b[2]) }] }, options:{ ...base, plugins:{ ...base.plugins, legend:{ display:false } }, scales:{ y:{ ticks:{ callback:money } } } } });
  add('c4', { type:'bar', data:{ labels:topCat.map(c=>c[0].length>26?c[0].slice(0,25)+'…':c[0]), datasets:STAT.map(s=>({ label:s, data:topCat.map(c=>c[1].s[s]), backgroundColor:STAT_COL[s] })) }, options:{ ...base, indexAxis:'y', scales:{ x:{ stacked:true, ticks:{ callback:money } }, y:{ stacked:true } } } });
  if (gset.length > 1) add('c5', { type:'bar', data:{ labels:gset.map(g=>'Gudang '+g), datasets:STAT.map(s=>({ label:s, data:gset.map(g=>rows.filter(r=>r.gudang===g&&r._ag===s).reduce((a,r)=>a+m(r),0)), backgroundColor:STAT_COL[s] })) }, options:{ ...base, scales:{ x:{ stacked:true }, y:{ stacked:true, ticks:{ callback:money } } } } });
}

/* ===================== 4) PENGGUNA (admin) ===================== */
async function viewUsers(){
  const r = await sb.from('profiles').select('*').order('full_name'); if (r.error) return $$('#mn').innerHTML = '<div class="txbad">Gagal memuat: ' + escH(r.error.message) + '</div>';
  $$('#mn').innerHTML = `<div class="card"><b>Menambah akun baru</b><div class="meta" style="margin-top:4px">Akun dibuat di dashboard Supabase: <b>Authentication &rarr; Users &rarr; Add user &rarr; Create new user</b> (centang Auto Confirm User). Akun baru otomatis muncul di tabel di bawah dengan peran <i>viewer</i> tanpa gudang. Atur nama tampilan, peran, dan gudangnya di sini. Ganti password / hapus akun lewat dashboard tersebut.</div></div>
  <div class="tw"><table style="min-width:900px"><thead><tr><th>Nama tampilan</th><th>Email</th><th>Peran</th><th>Gudang</th><th></th></tr></thead><tbody>${r.data.map(u=>`<tr data-id="${u.id}"><td><input class="nm" value="${escH(u.full_name)}" style="min-width:170px"></td><td>${escH(u.email)}</td>
  <td><select class="r" style="width:auto">${['viewer','editor','admin'].map(x=>`<option ${u.role===x?'selected':''}>${x}</option>`).join('')}</select></td>
  <td>${ALL_G.map(g=>`<label style="display:inline-flex;gap:3px;margin:0 8px 0 0;font-weight:400"><input type="checkbox" class="g" value="${g}" style="width:auto;margin:0" ${(u.gudang||[]).includes(g)?'checked':''}>${g}</label>`).join('')}</td>
  <td><button class="sv p">Simpan</button></td></tr>`).join('')}</tbody></table></div>
  <div class="meta" style="margin-top:8px">Admin selalu bisa mengakses semua gudang. Perubahan peran dan gudang berlaku setelah pengguna masuk ulang. Gudang C (dikelola produksi): centang hanya C pada akun tim produksi.</div>`;
  document.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.querySelector('.sv').onclick = async () => {
    const { data, error } = await sb.from('profiles').update({ full_name:tr.querySelector('.nm').value.trim() || null, role:tr.querySelector('.r').value, gudang:[...tr.querySelectorAll('.g:checked')].map(x=>x.value) }).eq('id', tr.dataset.id).select();
    alert(error ? 'Gagal: ' + error.message : !data.length ? 'Tidak diizinkan.' : 'Tersimpan.');
  });
}

const BK_TABLES = [['followup_items','Item tracker','id'],['followup_logs','Catatan follow-up','id'],['requesters','Daftar requester','name'],['stock_qty','Database stok Accurate','kode_norm'],['stock_uploads','Riwayat unggahan Aging','id'],['sales_summary','Ringkasan penjualan per part','kode_norm'],['part_flags','Tanda Dead Stock manual','kode_norm'],['stock_rows','Baris Aging (semua gudang)','id'],['profiles','Pengguna (peran &amp; gudang)','id'],['audit_log','Jejak audit','id']];
function viewBackup(){
  $$('#mn').innerHTML = `<div class="card"><h3 style="margin:0 0 4px">Cadangan Data</h3><div class="meta">Unduh data sebagai file CSV (bisa dibuka di Excel). Lakukan <b>mingguan</b> dan simpan di folder bertanggal / drive perusahaan. File ini juga bahan untuk memindahkan data jika suatu saat pindah hosting. Untuk cadangan tracker yang bisa dipulihkan (format tracker lama), gunakan tombol <b>Backup / Restore</b> di halaman Follow-up Tracker.</div>
  <div style="margin-top:12px;display:grid;gap:8px">${BK_TABLES.map(t=>`<div style="display:flex;gap:10px;align-items:center"><button class="bk" data-t="${t[0]}" data-o="${t[2]}">Unduh</button><span><b>${t[0]}</b> &middot; ${t[1]}</span><span class="meta" id="bk_${t[0]}"></span></div>`).join('')}</div></div>`;
  document.querySelectorAll('.bk').forEach(b => b.onclick = async () => {
    const t = b.dataset.t, st = $$('#bk_' + t); st.textContent = 'mengunduh...';
    try { const rows = await fetchAll(() => sb.from(t).select('*').order(b.dataset.o));
      const cols = rows.length ? Object.keys(rows[0]) : ['(kosong)'];
      csvDownload(`stp-${t}-${dayKey(new Date())}.csv`, cols, rows.map(r => cols.map(c => typeof r[c] === 'object' && r[c] !== null ? JSON.stringify(r[c]) : r[c])));
      st.textContent = num(rows.length) + ' baris'; } catch(e){ st.textContent = 'gagal: ' + e.message; }
  });
}
